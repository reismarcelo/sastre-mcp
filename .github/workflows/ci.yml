name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: workflow only needs to read repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
          python-version: "3.14"
      - name: Install project (locked)
        run: uv sync --locked
      - name: Run pip-audit
        run: uv run --with pip-audit pip-audit --strict --progress-spinner off
