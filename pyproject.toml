[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sastre-mcp"
description = "Sastre-MCP - Cisco Catalyst SD-WAN MCP Server"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Marcelo Reis", email = "sastre-support@cisco.com" },
]
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.27.0",
    "uvicorn[standard]>=0.44.0",
    "cisco-sdwan>=1.28",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha"
]
keywords = ["sdwan", "cisco", "viptela", "sastre", "network", "mcp"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "sse-starlette>=2.1",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[tool.hatch.version]
path = "sastre_mcp/__version__.py"

[project.urls]
"Homepage" = "https://github.com/reismarcelo/sastre-mcp"
"Bug Tracker" = "https://github.com/reismarcelo/sastre-mcp/issues"

[project.scripts]
sastre-mcp = "sastre_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sastre_mcp"]
force-include = { "sastre_mcp/py.typed" = "sastre_mcp/py.typed" }

[tool.hatch.build.targets.sdist]
include = ["/sastre_mcp", "/README.md", "/CHANGELOG.md", "/config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=sastre_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["sastre_mcp"]
omit = ["sastre_mcp/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["sastre_mcp", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
files = ["sastre_mcp"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "cisco_sdwan.*",
    "mcp.*",
]
ignore_missing_imports = true
